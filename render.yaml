services:
  - type: web
    name: iaduski-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: AI_PROVIDER
        value: typesafe
